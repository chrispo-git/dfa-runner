name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extract and Set Version
        id: get_version
        run: |
          # 1. Get version from tag
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$TAG_VERSION" >> $GITHUB_OUTPUT
          
          # 2. Aggressive sed: 
          # Matches 'version' anywhere in the line, handles any spacing or quotes.
          # We use a different delimiter (|) to avoid escaping issues.
          sed -i "s|version *= *['\"].*['\"]|version = \"$TAG_VERSION\"|" pyproject.toml
          
          # 3. VERIFICATION
          echo "--- Resulting pyproject.toml line ---"
          grep "version =" pyproject.toml
          
          # 4. FAIL-SAFE
          if grep -q "0.0.0" pyproject.toml; then
            echo "ERROR: The file still contains 0.0.0. sed did not find a match."
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  test-pypi-publish:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [test-pypi-publish] # Only runs if TestPyPI succeeds
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
