name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extract and Set Version
        id: get_version
        run: |
          # Get tag (v0.1.2 -> 0.1.2)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$TAG_VERSION" >> $GITHUB_OUTPUT
          
          # Use a more aggressive regex that finds 'version' at the start of a line
          # and replaces whatever is between the quotes.
          sed -i "s/^version *= *['\"].*['\"]/version = \"$TAG_VERSION\"/" pyproject.toml
          
          # VERIFICATION STEP:
          echo "Check: the version line now looks like this:"
          grep "^version =" pyproject.toml
          
          # FAIL-SAFE: Stop the job if the file still says 0.0.0
          if grep -q "0.0.0" pyproject.toml; then
            echo "ERROR: Version replacement failed! Check your pyproject.toml formatting."
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  test-pypi-publish:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [test-pypi-publish] # Only runs if TestPyPI succeeds
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
