name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extract and Set Version
        id: get_version
        run: |
          # 1. Get tag and strip 'refs/tags/'
          RAW_TAG=${GITHUB_REF##*/}
          
          # 2. Strip 'v' prefix if it exists (v0.1.2 -> 0.1.2)
          # This handles both 'v0.1.2' and '0.1.2'
          CLEAN_VERSION=$(echo $RAW_TAG | sed 's/^v//')
          
          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          
          # 3. Inject into pyproject.toml
          # Using ':' as delimiter and ensuring no extra spaces/newlines
          sed -i "s:version *= *['\"].*['\"]:version = \"${CLEAN_VERSION}\":" pyproject.toml
          
          # 4. VERIFICATION (Look for this in your logs!)
          echo "Final version in file:"
          grep "version =" pyproject.toml

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  test-pypi-publish:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [test-pypi-publish] # Only runs if TestPyPI succeeds
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
